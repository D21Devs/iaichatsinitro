name: Deploy → Locaweb

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # Gera o .env com a chave da OpenAI a partir dos Secrets do repo
      - name: Criar .env
        run: |
          echo "OPENAI_API_KEY_1=${{ secrets.OPENAI_API_KEY_1 }}" > .env

      # Deploy por FTP para Locaweb
      # Pasta de destino: raiz do FTP + /metis/sinistro/
      # Ajuste FTP_SERVER_DIR se o caminho no servidor for diferente
      # Deploy principal — pasta sinistro/
      - name: FTP Deploy — sinistro
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:     ${{ secrets.FTP_HOST }}
          username:   ${{ secrets.FTP_USER }}
          password:   ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          protocol:            ftp
          port:                21
          log-level:           verbose
          dangerous-clean-slate: true
          # Exclui arquivos que não devem ir para produção
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.claude/**
            **/documentos/**
            **/img/SVG/**
            **/img/ManualDeMarcaMétis2026.pdf
            **/api/debug.php
            **/api/write_config.php
            **/api/test_agent.php
            **/api/patch_tests.php
            **/training/migrate_tests.php
            **/.gitignore
            **/_parent/**

      # Deploy da landing page — pasta pai /metis/
      # FTP_PARENT_DIR: ex: /public_html/metis/
      - name: FTP Deploy — landing page /metis/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:     ${{ secrets.FTP_HOST }}
          username:   ${{ secrets.FTP_USER }}
          password:   ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_PARENT_DIR }}
          local-dir:  ./_parent/
          protocol:   ftp
          port:       21
          log-level:  standard
          dangerous-clean-slate: false
